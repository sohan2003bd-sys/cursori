name: build-wasm
on:
  push:
    branches: [main]
    paths: ["rust/**"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build kernels.wasm
        working-directory: rust
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Commit kernels.wasm into public/
        run: |
          cp rust/target/wasm32-unknown-unknown/release/kernels.wasm public/kernels.wasm
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/kernels.wasm
          git diff --cached --quiet || (git commit -m "build kernels.wasm" && git push)
