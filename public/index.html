<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cursor Painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceef3;--s2:#fff;--s3:#eef0f5;--on:#171a21;--onv:#5a6275;--out:#d9dce5;--wb:#c4c9d6;--wb2:#d9dde7;--dot:#b9c2d1;--gl:#2a5bd733;--rl:#f6f7fa;--p:#3b5bdb;--onp:#fff;--pc:#dde6ff;--onpc:#0f1f55;--sc:#e4e9f7;--onsc:#14224a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--s2:#1b1c21;--s3:#25272e;--on:#e9ebf1;--onv:#9a9fae;--out:#30323a;--wb:#131417;--wb2:#202126;--dot:#26293a;--gl:#7da2ff2e;--rl:#15161a;--p:#8fb0ff;--onp:#0b1b45;--pc:#1d2c55;--onpc:#dbe6ff;--sc:#272c3d;--onsc:#dbe4fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f12;--s2:#1b1c21;--s3:#25272e;--on:#e9ebf1;--onv:#9a9fae;--out:#30323a;--wb:#131417;--wb2:#202126;--dot:#26293a;--gl:#7da2ff2e;--rl:#15161a;--p:#8fb0ff;--onp:#0b1b45;--pc:#1d2c55;--onpc:#dbe6ff;--sc:#272c3d;--onsc:#dbe4fa;color-scheme:dark}
html{height:100dvh;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--on);font:14px/1.45 Inter,"Noto Sans Bengali",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;transition:background .4s}
button,label{font-family:inherit}button{-webkit-appearance:none;appearance:none}
svg.i{width:22px;height:22px;fill:currentColor;flex:none;pointer-events:none}
.shell{display:grid;grid-template-rows:56px minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;background:var(--s2);border-bottom:1px solid var(--out);position:relative;z-index:6}
.ic{width:36px;height:36px;margin-right:8px;border-radius:12px;display:grid;place-items:center;background:var(--p);color:var(--onp);transition:background .5s}
.tt{min-width:0;display:grid}
h1{margin:0;font-size:17px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--onv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--on);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ib:hover{background:var(--s3)}.ib:active,.ib.on{background:var(--pc);color:var(--onpc)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 336px;min-height:0}
.wk{display:grid;grid-template:22px minmax(0,1fr) 28px/22px minmax(0,1fr);min-width:0;min-height:0;background:var(--rl)}
.rc{background:var(--rl);border-right:1px solid var(--out);border-bottom:1px solid var(--out)}
.rl{display:block;width:100%;height:100%}
#rx{border-bottom:1px solid var(--out)}#ry{border-right:1px solid var(--out)}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:0;user-select:none;-webkit-user-select:none;background:radial-gradient(90% 80% at 50% 38%,var(--wb2),var(--wb))}
.stage.drag{cursor:grabbing}.stage.xh{cursor:crosshair}
.stage.xh::before,.stage.xh::after{content:"";position:absolute;pointer-events:none;z-index:4;background:var(--p);opacity:.7}
.stage.xh::before{left:var(--mx,-9px);top:0;bottom:0;width:1px}
.stage.xh::after{top:var(--my,-9px);left:0;right:0;height:1px}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#f3efe6;outline:1px solid #0003;box-shadow:0 1px 2px #0005,0 8px 18px #0004,0 30px 80px #0006}
.world.tech{background:#f1f5fa}.world.tech .tex{display:none}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov,#gd{pointer-events:none}
.tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.16;background:linear-gradient(0deg,#5a4a30 0 30%,#0000 0) 0 0/calc(3px/var(--z,1)) calc(3px/var(--z,1)),linear-gradient(90deg,#5a4a30 0 30%,#0000 0) 0 0/calc(3px/var(--z,1)) calc(3px/var(--z,1))}
.tex::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,#fff6 0,#0000 50%,#0003 100%)}
.grid{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(to right,var(--gl) calc(1px/var(--z,1)),#0000 0),linear-gradient(to bottom,var(--gl) calc(1px/var(--z,1)),#0000 0)}
.grid.on{display:block}
#so{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.empty{position:absolute;inset:0;display:grid;place-content:center;padding:24px;z-index:3}
.empty .box{display:grid;justify-items:center;gap:10px;padding:30px 34px;border-radius:28px;background:var(--s2);box-shadow:0 2px 6px #0003,0 18px 50px #0003;max-width:380px;text-align:center;cursor:pointer}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--onpc)}
.ring svg{width:34px;height:34px}
.empty h2{margin:4px 0 0;font-size:18px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--onv);line-height:1.65}
.cta{margin-top:6px;padding:11px 22px;border-radius:999px;background:var(--p);color:var(--onp);font-weight:600;font-size:14px}
.vt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:2px;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--s2) 90%,transparent);border:1px solid var(--out);box-shadow:0 8px 24px #0004;backdrop-filter:blur(10px)}
.vt button{min-width:36px;height:36px;padding:0 9px;border:0;border-radius:12px;background:none;color:var(--on);font-size:13px;font-weight:500;cursor:pointer;display:grid;place-items:center}
.vt button:hover{background:var(--s3)}.vt button.on{background:var(--pc);color:var(--onpc)}
.vt svg.i{width:20px;height:20px}
.vt i{width:1px;height:20px;background:var(--out);margin:0 3px}
.vt output{min-width:50px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--onv)}
.sb{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--out);background:var(--s2);font-size:12px;color:var(--onv);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
aside{position:relative;background:var(--s2);border-left:1px solid var(--out);padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.dock{display:contents}
.lin{order:0;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.lin i{display:block;height:100%;width:0;background:var(--p);border-radius:3px;transition:background .5s,width .15s}
.srow{order:1;display:flex;gap:8px}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--s3);border-radius:16px}
.stats div{padding:9px 12px;min-width:0}
.stats b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats small{font-size:11.5px;color:var(--onv)}
#st{display:none;height:auto;width:48px;border-radius:16px;background:var(--s3)}
.set{order:2;display:grid;gap:16px}
.row{display:grid;gap:8px}.row>span{font-size:12.5px;font-weight:600;color:var(--onv)}
.seg{display:flex;padding:3px;gap:2px;border-radius:14px;background:var(--s3)}
.chip{white-space:nowrap;flex:1;height:34px;padding:0 6px;border-radius:11px;border:0;background:none;color:var(--onv);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.chip.on{background:var(--pc);color:var(--onpc);font-weight:600}
.acts{order:3;margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fab{grid-row:1;grid-column:1/5;height:54px;border-radius:18px;border:0;background:var(--p);color:var(--onp);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--p) 38%,transparent);transition:background .5s,transform .1s}
.fab:active:not(:disabled){transform:scale(.98)}
.tb{grid-row:2;display:grid;justify-items:center;gap:2px;padding:9px 0 7px;border-radius:16px;border:0;background:var(--s3);color:var(--on);font-size:11.5px;font-weight:500;cursor:pointer;transition:background .15s}
.tb:hover:not(:disabled){background:var(--sc)}
button:disabled{opacity:.38;cursor:default;box-shadow:none}
button:focus-visible,label:focus-visible{outline:2px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
@media (max-width:900px){
.sub{display:none}
.main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.wk{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.rc,#rxw,#ryw,.sb{display:none}
aside{border:0;border-radius:24px 24px 0 0;padding:10px 12px 10px;gap:0;overflow:visible;box-shadow:0 -6px 24px #0004;z-index:5}
.dock{display:grid;gap:8px}
#st{display:grid}
.set{position:absolute;left:10px;right:10px;bottom:calc(100% + 10px);padding:16px;background:var(--s2);border:1px solid var(--out);border-radius:24px;box-shadow:0 14px 44px #0007;max-height:56dvh;overflow:auto;opacity:0;visibility:hidden;transform:translateY(12px) scale(.98);transition:.18s}
aside.open .set{opacity:1;visibility:visible;transform:none}
.acts{grid-template-columns:1fr 1fr 112px 1fr 1fr;align-items:center;gap:2px}
.fab{grid-row:auto;grid-column:auto;height:52px;border-radius:26px;font-size:14px;padding:0 6px}
.tb{grid-row:auto;background:none;padding:6px 0 2px}.tb:hover:not(:disabled){background:none}
.vt{bottom:12px}
}
/* ===== নেটিভ অ্যাপের মতো চেহারা ===== */
:root{--ease:cubic-bezier(.2,0,0,1)}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
header{border:0;background:color-mix(in srgb,var(--s2) 88%,var(--p) 5%);box-shadow:0 1px 0 var(--out),0 8px 24px #0000000d;backdrop-filter:saturate(1.6) blur(16px)}
.ic{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,var(--p),color-mix(in srgb,var(--p) 60%,#000));box-shadow:0 4px 12px color-mix(in srgb,var(--p) 40%,transparent)}
h1{font-size:18px}
.ib,.chip,.fab,.tb,.cta,.vt button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.ib{transition:background .2s,transform .14s var(--ease)}.ib:active{transform:scale(.9)}
aside{background:color-mix(in srgb,var(--s2) 93%,var(--p) 4%)}
.lin{height:8px;border-radius:4px}
.stats{border-radius:20px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--out) 70%,transparent)}
.stats div+div{border-left:1px solid color-mix(in srgb,var(--out) 80%,transparent)}
.seg{padding:4px;border-radius:18px}
.chip{height:36px;border-radius:14px;transition:background .25s var(--ease),color .2s,box-shadow .25s,transform .14s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--s2);color:var(--p);box-shadow:0 1px 2px #0003,0 3px 10px #0000001a}
.fab{border-radius:20px;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 68%,#000));box-shadow:0 10px 24px color-mix(in srgb,var(--p) 42%,transparent),inset 0 1px 0 #ffffff45;transition:transform .14s var(--ease),box-shadow .2s}
.fab svg{width:24px;height:24px}.fab:active:not(:disabled){transform:scale(.96);box-shadow:0 4px 12px color-mix(in srgb,var(--p) 40%,transparent),inset 0 1px 0 #ffffff45}
.tb{border-radius:18px;transition:background .2s,transform .14s var(--ease)}.tb:active:not(:disabled){transform:scale(.92)}.tb svg{transition:transform .2s var(--ease)}.tb:active:not(:disabled) svg{transform:scale(.85)}
.vt{border-radius:22px;padding:5px}.vt button{height:38px;border-radius:17px;transition:background .2s,transform .12s}.vt button:active{transform:scale(.9)}
.empty .box{border-radius:32px}.ring{background:linear-gradient(145deg,var(--pc),color-mix(in srgb,var(--pc) 70%,var(--p)))}
.cta{display:inline-block;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 68%,#000));box-shadow:0 8px 20px color-mix(in srgb,var(--p) 38%,transparent)}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .6s var(--ease) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media (max-width:900px){aside{border-radius:28px 28px 0 0}aside::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--out);margin:0 auto 8px}.set{border-radius:28px}}


/* ===== ম্যাটেরিয়াল ৩ ফ্ল্যাট বাটন: লাল প্রধান, বাকিগুলো টোনাল ===== */
:root{--m-p:#B3261E;--m-onp:#fff;--m-pc:#FFDAD6;--m-onpc:#410002;--m-out:#C9B8B6}
:root[data-theme="dark"]{--m-p:#FFB4AB;--m-onp:#690005;--m-pc:#93000A;--m-onpc:#FFDAD6;--m-out:#5c4543}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-p:#FFB4AB;--m-onp:#690005;--m-pc:#93000A;--m-onpc:#FFDAD6;--m-out:#5c4543}}
.tb,.ib,.vt button,.xc,.chip,.fab,.cta{box-shadow:none;text-shadow:none;background-image:none;filter:none;font-weight:600;letter-spacing:.1px}
.tb,.ib,.vt button,.xc{background:var(--m-pc);color:var(--m-onpc);border:0}
.tb:hover,.ib:hover,.vt button:hover,.xc:hover{background:color-mix(in srgb,var(--m-pc) 88%,var(--m-p))}
.tb:active:not(:disabled),.ib:active,.vt button:active,.xc:active,.fab:active:not(:disabled),.cta:active{transform:scale(.97);box-shadow:none;background:color-mix(in srgb,var(--m-pc) 78%,var(--m-p))}
.ib{width:auto;height:40px;padding:0 16px 0 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.ib svg{width:20px;height:20px}
.ib.on,.vt button.on{background:var(--m-p);color:var(--m-onp)}
.vt{border-radius:20px}.vt button{height:38px;border-radius:19px;display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:13px}.vt button svg{width:18px;height:18px}
.fab,.cta{background:var(--m-p);color:var(--m-onp);border:0;border-radius:20px}
.fab:disabled,.tb:disabled{opacity:.38;filter:none}
.seg{box-shadow:none;background:color-mix(in srgb,var(--m-pc) 45%,var(--s3))}
.chip{border:0;color:var(--on)}.chip.on{background:var(--m-p);color:var(--m-onp);box-shadow:none}
.xc{width:40px;height:40px;border-radius:50%;padding:0}

/* ফোনের মাপ ঠিক রাখা */
#st{flex:none;flex-direction:column;justify-content:center;gap:2px;width:68px;height:auto;min-height:54px;padding:6px 4px;border-radius:16px;font-size:11.5px}
.vt{max-width:calc(100% - 16px);padding:3px;gap:1px}
.vt button{min-width:34px;height:36px;padding:0 8px;font-size:12.5px;gap:4px}
.vt output{min-width:44px;font-size:12px}

/* সেটিংসের ✕ বাটন সবসময় ডানে */
.sh{width:100%;align-self:stretch;min-height:40px;padding-right:48px}
.xc{position:absolute;top:10px;right:10px;z-index:2;margin:0}
</style></head>

<div class="shell">
<header>
  <div class="ic" id="ic"><svg class="i"><use href="#i-brush"/></svg></div>
  <div class="tt"><h1>Cursor Painter</h1><div class="sub">ছবি দিন, কার্সরের দল রংতুলিতে এঁকে দেবে</div></div>
  <span class="sp"></span>
  <label class="ib" for="file" title="ছবি বাছুন" aria-label="ছবি বাছুন" tabindex="0"><svg class="i"><use href="#i-img"/></svg><span>ছবি</span></label>
  <button class="ib" id="tg" title="থিম বদলান" aria-label="থিম বদলান"><svg class="i"><use href="#i-theme"/></svg><span>থিম</span></button>
</header>
<div class="main">
<section class="wk">
  <div class="rc"></div><div class="rl" id="rxw"><canvas class="rl" id="rx"></canvas></div>
  <div class="rl" id="ryw"><canvas class="rl" id="ry"></canvas></div>
  <div class="stage" id="stage">
